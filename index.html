<!DOCTYPE html>
<html lang="he" dir="rtl" class="h-full bg-[#121212]">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DiscBeat - נגן מוזיקה ואלבומים</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Heebo -->
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            overflow: hidden;
        }
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.4);
        }
        .slider-thumb::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            transition: transform 0.1s ease, background-color 0.2s ease;
        }
        .slider-thumb::-webkit-slider-thumb:hover {
            transform: scale(1.3);
            background: #1db954;
        }
        @keyframes scaleIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .animate-scaleIn {
            animation: scaleIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="h-full text-white flex flex-col bg-[#121212]">

    <!-- App Container -->
    <div id="app-container" class="flex-1 flex overflow-hidden relative">
        <aside id="left-sidebar" class="hidden md:flex flex-col w-64 bg-black p-5 shrink-0 z-20 border-l border-[#282828] justify-between select-none">
            <div>
                <div class="flex items-center gap-2 mb-6 px-1">
                    <span class="w-3 h-3 rounded-full bg-[#ff5f56] inline-block cursor-pointer"></span>
                    <span class="w-3 h-3 rounded-full bg-[#ffbd2e] inline-block cursor-pointer"></span>
                    <span class="w-3 h-3 rounded-full bg-[#27c93f] inline-block cursor-pointer"></span>
                </div>

                <div class="flex items-center gap-3 px-2 mb-8 cursor-pointer group" onclick="switchTab('home')">
                    <div class="w-10 h-10 rounded-full bg-[#1db954] flex items-center justify-center text-black font-bold text-xl shadow-lg">
                        <i class="fa-solid fa-compact-disc"></i>
                    </div>
                    <span class="text-2xl font-black tracking-tight text-white">DiscBeat</span>
                </div>

                <nav class="space-y-1.5">
                    <button onclick="switchTab('home')" id="nav-home" class="w-full flex items-center gap-4 px-3.5 py-2.5 rounded-lg text-sm font-bold text-white bg-[#282828] transition">
                        <i class="fa-solid fa-house text-lg w-5 text-center"></i> בית
                    </button>
                    <button onclick="switchTab('browse')" id="nav-browse" class="w-full flex items-center gap-4 px-3.5 py-2.5 rounded-lg text-sm font-bold text-[#b3b3b3] hover:text-white hover:bg-white/5 transition">
                        <i class="fa-solid fa-magnifying-glass text-lg w-5 text-center"></i> חיפוש
                    </button>
                    <button onclick="switchTab('library')" id="nav-library" class="w-full flex items-center gap-4 px-3.5 py-2.5 rounded-lg text-sm font-bold text-[#b3b3b3] hover:text-white hover:bg-white/5 transition">
                        <i class="fa-solid fa-book-open text-lg w-5 text-center"></i> הספרייה שלך
                    </button>
                </nav>

                <div class="my-6 border-t border-[#282828]"></div>

                <div class="space-y-3">
                    <button onclick="openCreateAlbumModal()" class="w-full flex items-center justify-center gap-2 bg-[#1db954] hover:bg-[#1ed760] text-black font-extrabold text-xs py-3 px-4 rounded-full transition shadow-lg active:scale-95">
                        <i class="fa-solid fa-plus text-sm"></i> צור אלבום חדש
                    </button>

                    <div class="px-2 pt-2 text-[11px] font-bold uppercase tracking-wider text-[#b3b3b3]">האלבומים במערכת</div>
                    <div id="sidebar-album-container" class="max-h-48 overflow-y-auto space-y-1 pr-1"></div>
                </div>
            </div>

            <div class="pt-4 border-t border-[#282828] text-xs text-[#b3b3b3] flex flex-col gap-1">
                <div class="flex justify-between items-center px-1">
                    <span>אלבומים:</span>
                    <strong id="stat-albums-count" class="text-white font-bold">0</strong>
                </div>
                <div class="flex justify-between items-center px-1">
                    <span>סך הכל שירים:</span>
                    <strong id="stat-songs-count" class="text-white font-bold">0</strong>
                </div>
            </div>
        </aside>

        <main id="main-content" class="flex-1 flex flex-col bg-gradient-to-b from-[#222222] via-[#121212] to-[#121212] overflow-y-auto relative">
            <header class="sticky top-0 z-10 flex items-center justify-between px-6 py-4 bg-[#121212]/80 backdrop-blur-md gap-3 border-b border-white/5">
                <div class="flex items-center gap-3">
                    <button onclick="switchTab('home')" class="w-8 h-8 rounded-full bg-black/60 flex items-center justify-center text-[#b3b3b3] hover:text-white transition">
                        <i class="fa-solid fa-chevron-right text-sm"></i>
                    </button>
                    <button onclick="switchTab('library')" class="w-8 h-8 rounded-full bg-black/60 flex items-center justify-center text-[#b3b3b3] hover:text-white transition">
                        <i class="fa-solid fa-chevron-left text-sm"></i>
                    </button>
                </div>

                <div class="flex items-center gap-3">
                    <button onclick="openCreateAlbumModal()" class="md:hidden bg-[#1db954] text-black text-xs font-bold px-4 py-2 rounded-full flex items-center gap-1.5 shadow-lg">
                        <i class="fa-solid fa-plus"></i> אלבום חדש
                    </button>
                </div>
            </header>

            <div id="view-container" class="flex-1 px-4 md:px-6 pb-40"></div>
        </main>
    </div>

    <!-- סרגל ניווט תחתון לטלפונים ניידים -->
    <nav class="md:hidden fixed bottom-24 left-0 right-0 bg-[#181818]/95 backdrop-blur-md border-t border-[#282828] flex justify-around py-2.5 z-40">
        <button onclick="switchTab('home')" class="flex flex-col items-center gap-1 text-white" id="mob-nav-home">
            <i class="fa-solid fa-house text-base"></i>
            <span class="text-[10px] font-bold">בית</span>
        </button>
        <button onclick="switchTab('browse')" class="flex flex-col items-center gap-1 text-[#b3b3b3]" id="mob-nav-browse">
            <i class="fa-solid fa-magnifying-glass text-base"></i>
            <span class="text-[10px] font-bold">חיפוש</span>
        </button>
        <button onclick="switchTab('library')" class="flex flex-col items-center gap-1 text-[#b3b3b3]" id="mob-nav-library">
            <i class="fa-solid fa-book-open text-base"></i>
            <span class="text-[10px] font-bold">הספרייה</span>
        </button>
    </nav>

    <!-- Bottom Player Bar -->
    <footer id="bottom-player" class="h-24 bg-black border-t border-[#282828] px-4 md:px-6 flex items-center justify-between z-50 fixed bottom-0 left-0 right-0">
        <div class="flex items-center gap-3.5 w-1/3 min-w-[120px]">
            <div id="player-art-container" onclick="openFullscreenPlayer()" class="w-12 h-12 md:w-14 md:h-14 bg-[#282828] rounded-lg overflow-hidden shrink-0 relative cursor-pointer group shadow-lg">
                <img id="player-art" src="https://placehold.co/120x120/282828/ffffff?text=🎵" alt="עטיפה" class="w-full h-full object-cover">
            </div>
            <div class="overflow-hidden cursor-pointer" onclick="openFullscreenPlayer()">
                <div id="player-title" class="text-xs md:text-sm font-bold truncate hover:underline">אין שיר נבחר</div>
                <div id="player-artist" class="text-[11px] md:text-xs text-[#b3b3b3] truncate mt-0.5">בחר אלבום להשמעה</div>
            </div>
        </div>

        <div class="flex flex-col items-center max-w-xl w-1/3 px-2">
            <div class="flex items-center gap-4 md:gap-7 mb-1.5">
                <button onclick="playPreviousSong()" class="text-[#b3b3b3] hover:text-white transition text-sm md:text-base" title="שיר קודם">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button onclick="togglePlayPause()" id="btn-play-pause" class="w-8 h-8 md:w-10 md:h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-md">
                    <i class="fa-solid fa-play text-xs md:text-sm ml-0.5"></i>
                </button>
                <button onclick="playNextSong()" class="text-[#b3b3b3] hover:text-white transition text-sm md:text-base" title="שיר הבא">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>

            <div class="hidden sm:flex items-center gap-2.5 w-full text-[11px] font-mono text-[#b3b3b3]" dir="ltr">
                <span id="current-time">0:00</span>
                <input type="range" id="progress-slider" min="0" max="100" value="0" step="0.1" class="flex-1 h-1 bg-[#4d4d4d] rounded-lg appearance-none cursor-pointer slider-thumb accent-[#1db954]" oninput="seekAudio(this.value)">
                <span id="total-duration">0:00</span>
            </div>
        </div>

        <div class="hidden sm:flex items-center justify-end gap-3 w-1/3">
            <div class="flex items-center gap-2">
                <button onclick="toggleMute()" id="btn-volume-icon" class="text-[#b3b3b3] hover:text-white transition text-sm">
                    <i class="fa-solid fa-volume-high"></i>
                </button>
                <input type="range" id="volume-slider" min="0" max="1" value="1" step="0.01" class="w-20 h-1 bg-[#4d4d4d] rounded-lg appearance-none cursor-pointer slider-thumb accent-white" oninput="adjustVolume(this.value)">
            </div>
            <button onclick="openFullscreenPlayer()" class="text-[#b3b3b3] hover:text-white transition text-sm ml-2" title="מסך מלא">
                <i class="fa-solid fa-expand"></i>
            </button>
        </div>
    </footer>

    <!-- Fullscreen Player -->
    <div id="fullscreen-player" class="fixed inset-0 z-50 hidden bg-gradient-to-b from-black via-[#383838] to-black flex-col justify-between p-6 md:p-12 transition-all duration-300">
        <div class="flex items-center justify-between w-full">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-[#ff5f56]"></span>
                <span class="w-3 h-3 rounded-full bg-[#ffbd2e]"></span>
                <span class="w-3 h-3 rounded-full bg-[#27c93f]"></span>
            </div>
            <button onclick="closeFullscreenPlayer()" class="w-12 h-12 rounded-full bg-white/10 hover:bg-white/20 text-white flex items-center justify-center transition shadow-xl">
                <i class="fa-solid fa-chevron-down text-lg"></i>
            </button>
        </div>

        <div class="flex-1 flex flex-col items-center justify-center my-6 max-w-xl mx-auto text-center w-full">
            <div class="w-64 h-64 sm:w-80 sm:h-80 md:w-96 md:h-96 rounded-2xl overflow-hidden shadow-2xl mb-8 border border-white/10 bg-[#282828]">
                <img id="fs-player-art" src="https://placehold.co/400x400/282828/ffffff?text=DiscBeat" alt="Full Artwork" class="w-full h-full object-cover">
            </div>
            
            <div class="w-full flex items-center justify-between px-4 mb-2">
                <div class="text-right overflow-hidden">
                    <h1 id="fs-player-title" class="text-2xl sm:text-4xl font-black text-white truncate leading-tight">אין שיר נבחר</h1>
                    <p id="fs-player-artist" class="text-lg sm:text-2xl font-medium text-[#b3b3b3] truncate mt-1">אמן לא ידוע</p>
                </div>
            </div>

            <div class="w-full px-4 my-6">
                <div class="flex items-center gap-3 text-xs font-mono text-[#b3b3b3]" dir="ltr">
                    <span id="fs-current-time">0:00</span>
                    <input type="range" id="fs-progress-slider" min="0" max="100" value="0" step="0.1" class="flex-1 h-1.5 bg-[#4d4d4d] rounded-lg appearance-none cursor-pointer slider-thumb accent-[#1db954]" oninput="seekAudio(this.value)">
                    <span id="fs-total-duration">0:00</span>
                </div>
            </div>

            <div class="flex items-center gap-8 my-2">
                <button onclick="playPreviousSong()" class="text-white transition text-2xl">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button onclick="togglePlayPause()" id="fs-btn-play-pause" class="w-16 h-16 rounded-full bg-[#1db954] text-black flex items-center justify-center hover:scale-105 active:scale-95 transition shadow-2xl">
                    <i class="fa-solid fa-play text-xl ml-1"></i>
                </button>
                <button onclick="playNextSong()" class="text-white transition text-2xl">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
            </div>
        </div>
        <div class="text-center text-xs text-white/40">DiscBeat Fullscreen View Mode</div>
    </div>

    <audio id="audio-element" preload="metadata"></audio>

    <!-- Modal for Creating Album -->
    <div id="create-album-modal" class="fixed inset-0 bg-black/80 z-50 hidden flex items-center justify-center p-4">
        <div class="bg-[#282828] rounded-2xl p-6 max-w-lg w-full shadow-2xl border border-white/10 animate-scaleIn overflow-y-auto max-h-[90vh]">
            <div class="flex items-center justify-between mb-5 border-b border-white/10 pb-3">
                <h3 class="text-xl font-bold text-white">יצירת אלבום חדש</h3>
                <button onclick="closeCreateAlbumModal()" class="text-[#b3b3b3] hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            
            <form onsubmit="handleCreateAlbumSubmit(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-[#b3b3b3] mb-1.5">שם האלבום</label>
                    <input type="text" id="input-album-title" required placeholder="לדוגמה: אוסף קיץ" class="w-full px-4 py-2.5 bg-[#121212] rounded-lg text-sm text-white focus:outline-none border border-white/10 focus:border-[#1db954]">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-[#b3b3b3] mb-1.5">שם האמן / יוצר</label>
                    <input type="text" id="input-album-artist" required placeholder="לדוגמה: אמן ראשי" class="w-full px-4 py-2.5 bg-[#121212] rounded-lg text-sm text-white focus:outline-none border border-white/10 focus:border-[#1db954]">
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-[#b3b3b3] mb-1.5">תמונת עטיפה</label>
                    <div class="flex flex-col gap-2">
                        <label class="cursor-pointer bg-[#3e3e3e] hover:bg-[#4e4e4e] px-4 py-3 rounded-lg text-xs font-bold flex items-center justify-center gap-2 text-white border border-white/10">
                            <i class="fa-solid fa-image text-sm text-[#1db954]"></i>
                            <span id="cover-filename-label">העלה קובץ תמונה</span>
                            <input type="file" id="input-album-cover-file" accept="image/*" class="hidden" onchange="handleCoverFileSelect(event)">
                        </label>
                        <div id="cover-preview-container" class="hidden mt-2 flex items-center gap-3 bg-[#121212] p-2 rounded-lg">
                            <img id="cover-preview-img" src="" alt="תצוגה מקדימה" class="w-12 h-12 object-cover rounded">
                            <span class="text-xs text-[#b3b3b3]">תצוגה מקדימה לעטיפה</span>
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-[#b3b3b3] mb-1.5">קבצי שמע</label>
                    <label class="cursor-pointer flex flex-col items-center justify-center border-2 border-dashed border-white/20 hover:border-[#1db954] bg-[#121212] rounded-xl p-6 transition group text-center">
                        <i class="fa-solid fa-cloud-arrow-up text-3xl text-[#1db954] mb-2 group-hover:scale-110 transition"></i>
                        <span id="selected-files-label" class="text-sm font-bold text-white">לחץ לבחירת קבצי שמע</span>
                        <input type="file" id="input-album-songs" accept="audio/*" multiple required class="hidden" onchange="updateFilesLabel(event)">
                    </label>
                </div>

                <div class="flex justify-end gap-3 pt-3">
                    <button type="button" onclick="closeCreateAlbumModal()" class="px-5 py-2.5 rounded-full text-sm font-bold text-[#b3b3b3] hover:text-white">ביטול</button>
                    <button type="submit" class="px-6 py-2.5 bg-[#1db954] hover:bg-[#1ed760] text-black font-extrabold text-sm rounded-full shadow-lg transition">צור אלבום</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let db = null;
        const STORE_NAME = 'albums';
        let albumsList = [];
        let activeTab = 'home';
        let currentAlbumId = null;
        let currentSongIndex = -1;
        let isPlaying = false;
        let tempCoverBlob = null;

        const audioElement = document.getElementById('audio-element');

        // מנגנון סנכרון בזמן אמת בין לשוניות וחלונות פתוחים בדפדפן
        const syncChannel = new BroadcastChannel('discbeat_sync_channel');
        syncChannel.onmessage = (event) => {
            if (event.data === 'update_albums') {
                loadAlbumsFromDB().then(() => {
                    updateGlobalStats();
                    renderView();
                    renderSidebarAlbums();
                });
            }
        };

        function notifyAllClients() {
            syncChannel.postMessage('update_albums');
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('DiscBeat_SharedGlobalDB', 1);
                request.onerror = (e) => reject(e.target.error);
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        async function loadAlbumsFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = () => {
                    albumsList = request.result || [];
                    
                    albumsList.forEach(album => {
                        if (album.coverBlob) {
                            album.coverUrl = URL.createObjectURL(album.coverBlob);
                        }
                        if (album.songs) {
                            album.songs.forEach(song => {
                                if (song.blob) {
                                    song.url = URL.createObjectURL(song.blob);
                                }
                            });
                        }
                    });

                    resolve();
                };
                request.onerror = (e) => reject(e);
            });
        }

        async function saveAlbumToDB(albumObj) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.add(albumObj);
                request.onsuccess = () => resolve(request.result);
                request.onerror = (e) => reject(e);
            });
        }

        async function deleteAlbumFromDB(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e);
            });
        }

        window.addEventListener('DOMContentLoaded', async () => {
            await initDB();
            await loadAlbumsFromDB();

            updateGlobalStats();
            renderView();
            renderSidebarAlbums();

            audioElement.addEventListener('timeupdate', () => {
                if (!isNaN(audioElement.duration)) {
                    const progressPercent = (audioElement.currentTime / audioElement.duration) * 100;
                    document.getElementById('progress-slider').value = progressPercent;
                    document.getElementById('current-time').innerText = formatTime(audioElement.currentTime);
                    document.getElementById('total-duration').innerText = formatTime(audioElement.duration);

                    document.getElementById('fs-progress-slider').value = progressPercent;
                    document.getElementById('fs-current-time').innerText = formatTime(audioElement.currentTime);
                    document.getElementById('fs-total-duration').innerText = formatTime(audioElement.duration);
                }
            });

            audioElement.addEventListener('ended', () => {
                playNextSong();
            });

            audioElement.addEventListener('play', () => {
                isPlaying = true;
                updatePlayPauseButton();
            });

            audioElement.addEventListener('pause', () => {
                isPlaying = false;
                updatePlayPauseButton();
            });
        });

        function updateGlobalStats() {
            let totalSongs = 0;
            albumsList.forEach(album => {
                if (album.songs) totalSongs += album.songs.length;
            });
            document.getElementById('stat-albums-count').innerText = albumsList.length;
            document.getElementById('stat-songs-count').innerText = totalSongs;
        }

        function switchTab(tab) {
            activeTab = tab;
            currentAlbumId = null;
            ['home', 'browse', 'library'].forEach(t => {
                const navBtn = document.getElementById(`nav-${t}`);
                const mobBtn = document.getElementById(`mob-nav-${t}`);

                if (navBtn) {
                    navBtn.className = (t === tab) ? 
                        "w-full flex items-center gap-4 px-3.5 py-2.5 rounded-lg text-sm font-bold text-white bg-[#282828] transition" : 
                        "w-full flex items-center gap-4 px-3.5 py-2.5 rounded-lg text-sm font-bold text-[#b3b3b3] hover:text-white hover:bg-white/5 transition";
                }

                if (mobBtn) {
                    mobBtn.className = (t === tab) ?
                        "flex flex-col items-center gap-1 text-white font-extrabold" :
                        "flex flex-col items-center gap-1 text-[#b3b3b3]";
                }
            });
            renderView();
        }

        function openAlbumDetail(albumId) {
            currentAlbumId = albumId;
            renderView();
        }

        function renderView() {
            const container = document.getElementById('view-container');
            if (!container) return;

            if (currentAlbumId !== null) {
                const album = albumsList.find(a => String(a.id) === String(currentAlbumId));
                if (!album) {
                    switchTab('home');
                    return;
                }

                container.innerHTML = `
                    <div class="py-6">
                        <div class="flex flex-col md:flex-row items-start md:items-end gap-6 mb-8 bg-gradient-to-b from-[#3a3a3a] to-transparent p-6 rounded-2xl shadow-xl">
                            <img src="${album.coverUrl || 'https://placehold.co/200x200/282828/ffffff?text=Album'}" class="w-44 h-44 object-cover shadow-2xl rounded-xl" alt="עטיפה">
                            <div class="flex-1">
                                <span class="text-xs uppercase font-extrabold tracking-widest text-[#1db954]">אלבום מוזיקה</span>
                                <h1 class="text-3xl md:text-5xl font-black mt-1 mb-2">${album.title}</h1>
                                <p class="text-sm text-[#b3b3b3] font-semibold">${album.artist} • ${album.songs ? album.songs.length : 0} שירים</p>
                            </div>
                            <div class="flex items-center gap-3">
                                ${album.songs && album.songs.length > 0 ? `
                                    <button onclick="playAlbumSong('${album.id}', 0)" class="w-14 h-14 rounded-full bg-[#1db954] hover:bg-[#1ed760] text-black flex items-center justify-center text-xl shadow-2xl hover:scale-105 transition">
                                        <i class="fa-solid fa-play ml-0.5"></i>
                                    </button>
                                ` : ''}
                                <button onclick="removeAlbum(${album.id})" class="p-3.5 bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white rounded-full transition text-sm" title="מחק אלבום">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>

                        <div class="space-y-1">
                            ${album.songs && album.songs.length > 0 ? album.songs.map((song, idx) => `
                                <div onclick="playAlbumSong('${album.id}',${idx})" class="flex items-center justify-between p-3 rounded-lg hover:bg-white/10 transition cursor-pointer group">
                                    <div class="flex items-center gap-4">
                                        <span class="w-6 text-center text-sm text-[#b3b3b3] group-hover:text-white">${idx + 1}</span>
                                        <div>
                                            <div class="text-sm font-bold text-white">${song.name}</div>
                                            <div class="text-xs text-[#b3b3b3]">${album.artist}</div>
                                        </div>
                                    </div>
                                    <button class="text-white opacity-0 group-hover:opacity-100 transition"><i class="fa-solid fa-play"></i></button>
                                </div>
                            `).join('') : '<p class="text-[#b3b3b3] text-sm">אין שירים באלבום זה.</p>'}
                        </div>
                    </div>
                `;
                return;
            }

            if (activeTab === 'browse' || activeTab === 'library') {
                container.innerHTML = `
                    <div class="py-8">
                        <h1 class="text-3xl font-black mb-6">${activeTab === 'browse' ? 'חיפוש אלבומים' : 'הספרייה שלך'}</h1>
                        <input type="text" id="search-input" oninput="filterAlbums(this.value)" placeholder="חפש לפי שם אלבום או אמן..." class="w-full md:w-96 px-4 py-3 bg-[#2a2a2a] rounded-xl text-sm text-white focus:outline-none border border-white/10 focus:border-[#1db954] mb-8">
                        <div id="browse-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                            ${renderAlbumsHtml(albumsList)}
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="py-6 space-y-8">
                    <div>
                        <h2 class="text-2xl font-black tracking-tight mb-4">האלבומים ב-DiscBeat</h2>
                        ${albumsList.length === 0 ? `
                            <p class="text-sm text-[#b3b3b3]">אין עדיין אלבומים במערכת. לחץ על "צור אלבום חדש" כדי להתחיל.</p>
                        ` : `
                            <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-6">
                                ${renderAlbumsHtml(albumsList)}
                            </div>
                        `}
                    </div>
                </div>
            `;
        }

        function renderAlbumsHtml(list) {
            return list.map(album => `
                <div onclick="openAlbumDetail('${album.id}')" class="bg-[#181818] hover:bg-[#282828] p-4 rounded-xl transition cursor-pointer group flex flex-col gap-3 shadow-lg relative">
                    <div class="w-full aspect-square bg-[#282828] rounded-lg overflow-hidden relative shadow-md">
                        <img src="${album.coverUrl || 'https://placehold.co/200x200/282828/ffffff?text=Album'}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300" alt="עטיפה">
                        <button onclick="event.stopPropagation(); playAlbumSong('${album.id}', 0)" class="absolute bottom-3 left-3 w-12 h-12 rounded-full bg-[#1db954] text-black flex items-center justify-center shadow-xl opacity-0 translate-y-2 group-hover:opacity-100 group-hover:translate-y-0 transition duration-200">
                            <i class="fa-solid fa-play ml-0.5"></i>
                        </button>
                    </div>
                    <div class="overflow-hidden">
                        <h3 class="font-bold text-sm truncate text-white">${album.title}</h3>
                        <p class="text-xs text-[#b3b3b3] truncate mt-0.5">${album.artist}</p>
                    </div>
                </div>
            `).join('');
        }

        function renderSidebarAlbums() {
            const container = document.getElementById('sidebar-album-container');
            if (!container) return;

            if (albumsList.length === 0) {
                container.innerHTML = '<div class="text-xs text-[#b3b3b3] px-2">אין אלבומים</div>';
                return;
            }

            container.innerHTML = albumsList.map(album => `
                <div onclick="openAlbumDetail('${album.id}')" class="flex items-center gap-3 px-2 py-2 rounded-lg hover:bg-white/10 cursor-pointer transition">
                    <img src="${album.coverUrl || 'https://placehold.co/40x40/282828/ffffff?text=🎵'}" class="w-8 h-8 rounded object-cover">
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-white truncate">${album.title}</div>
                        <div class="text-[10px] text-[#b3b3b3] truncate">${album.artist}</div>
                    </div>
                </div>
            `).join('');
        }

        function filterAlbums(query) {
            const grid = document.getElementById('browse-grid');
            if (!grid) return;
            const filtered = albumsList.filter(a => a.title.toLowerCase().includes(query.toLowerCase()) || a.artist.toLowerCase().includes(query.toLowerCase()));
            grid.innerHTML = renderAlbumsHtml(filtered);
        }

        function openCreateAlbumModal() {
            document.getElementById('input-album-title').value = '';
            document.getElementById('input-album-artist').value = '';
            document.getElementById('input-album-cover-file').value = '';
            document.getElementById('input-album-songs').value = '';
            document.getElementById('cover-filename-label').innerText = 'העלה קובץ תמונה';
            document.getElementById('cover-preview-container').classList.add('hidden');
            document.getElementById('selected-files-label').innerText = 'לחץ לבחירת קבצי שמע';
            tempCoverBlob = null;
            document.getElementById('create-album-modal').classList.remove('hidden');
        }

        function closeCreateAlbumModal() {
            document.getElementById('create-album-modal').classList.add('hidden');
        }

        function handleCoverFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                tempCoverBlob = file;
                document.getElementById('cover-filename-label').innerText = file.name;
                const previewUrl = URL.createObjectURL(file);
                document.getElementById('cover-preview-img').src = previewUrl;
                document.getElementById('cover-preview-container').classList.remove('hidden');
            }
        }

        function updateFilesLabel(event) {
            const files = event.target.files;
            if (files && files.length > 0) {
                document.getElementById('selected-files-label').innerText = `נבחרו ${files.length} קבצי שמע בהצלחה`;
            }
        }

        async function handleCreateAlbumSubmit(event) {
            event.preventDefault();
            const title = document.getElementById('input-album-title').value.trim();
            const artist = document.getElementById('input-album-artist').value.trim();
            const songFilesInput = document.getElementById('input-album-songs');

            if (!title || !artist || !songFilesInput.files.length) {
                alert('נא למלא את כל השדות ולבחור לפחות שיר אחד');
                return;
            }

            const songs = Array.from(songFilesInput.files).map(file => ({
                name: file.name.replace(/\.[^/.]+$/, ""),
                blob: file,
                url: URL.createObjectURL(file)
            }));

            const newAlbum = {
                title: title,
                artist: artist,
                coverBlob: tempCoverBlob,
                songs: songs,
                createdAt: new Date().toISOString()
            };

            try {
                const newId = await saveAlbumToDB(newAlbum);
                newAlbum.id = newId;
                if (tempCoverBlob) newAlbum.coverUrl = URL.createObjectURL(tempCoverBlob);

                albumsList.push(newAlbum);
                updateGlobalStats();
                renderView();
                renderSidebarAlbums();
                closeCreateAlbumModal();

                notifyAllClients();
            } catch (err) {
                console.error("שגיאה בשמירת האלבום:", err);
                alert('שגיאה בשמירת האלבום למסד הנתונים');
            }
        }

        async function removeAlbum(id) {
            if (!confirm('האם אתה בטוח שברצונך למחוק אלבום זה?')) return;
            try {
                await deleteAlbumFromDB(id);
                albumsList = albumsList.filter(a => String(a.id) !== String(id));
                currentAlbumId = null;
                updateGlobalStats();
                renderView();
                renderSidebarAlbums();

                notifyAllClients();
            } catch (err) {
                console.error("שגיאה במחיקת אלבום:", err);
            }
        }

        function playAlbumSong(albumId, songIndex) {
            const album = albumsList.find(a => String(a.id) === String(albumId));
            if (!album || !album.songs || !album.songs[songIndex]) return;

            currentAlbumId = albumId;
            currentSongIndex = songIndex;
            const song = album.songs[songIndex];

            if (!song.url && song.blob) {
                song.url = URL.createObjectURL(song.blob);
            }

            if (!song.url) {
                alert("לא ניתן לנגן שיר זה, קובץ השמע חסר.");
                return;
            }

            audioElement.src = song.url;
            audioElement.play().catch(e => console.log("הפעלת השמע ממתינה לאישור המשתמש"));

            document.getElementById('player-title').innerText = song.name;
            document.getElementById('player-artist').innerText = album.artist;
            document.getElementById('player-art').src = album.coverUrl || 'https://placehold.co/120x120/282828/ffffff?text=🎵';

            document.getElementById('fs-player-title').innerText = song.name;
            document.getElementById('fs-player-artist').innerText = album.artist;
            document.getElementById('fs-player-art').src = album.coverUrl || 'https://placehold.co/400x400/282828/ffffff?text=DiscBeat';

            isPlaying = true;
            updatePlayPauseButton();
        }

        function togglePlayPause() {
            if (!audioElement.src) return;
            if (audioElement.paused) {
                audioElement.play();
            } else {
                audioElement.pause();
            }
        }

        function updatePlayPauseButton() {
            const iconHtml = isPlaying ? '<i class="fa-solid fa-pause text-sm"></i>' : '<i class="fa-solid fa-play text-sm ml-0.5"></i>';
            const fsIconHtml = isPlaying ? '<i class="fa-solid fa-pause text-xl"></i>' : '<i class="fa-solid fa-play text-xl ml-1"></i>';
            
            const btn = document.getElementById('btn-play-pause');
            const fsBtn = document.getElementById('fs-btn-play-pause');
            if (btn) btn.innerHTML = iconHtml;
            if (fsBtn) fsBtn.innerHTML = fsIconHtml;
        }

        function playNextSong() {
            if (currentAlbumId === null || currentSongIndex === -1) return;
            const album = albumsList.find(a => String(a.id) === String(currentAlbumId));
            if (!album || !album.songs) return;

            if (currentSongIndex + 1 < album.songs.length) {
                playAlbumSong(currentAlbumId, currentSongIndex + 1);
            } else {
                playAlbumSong(currentAlbumId, 0);
            }
        }

        function playPreviousSong() {
            if (currentAlbumId === null || currentSongIndex === -1) return;
            const album = albumsList.find(a => String(a.id) === String(currentAlbumId));
            if (!album || !album.songs) return;

            if (currentSongIndex - 1 >= 0) {
                playAlbumSong(currentAlbumId, currentSongIndex - 1);
            } else {
                playAlbumSong(currentAlbumId, album.songs.length - 1);
            }
        }

        function seekAudio(value) {
            if (!isNaN(audioElement.duration)) {
                audioElement.currentTime = (value / 100) * audioElement.duration;
            }
        }

        function adjustVolume(value) {
            audioElement.volume = value;
            const icon = document.getElementById('btn-volume-icon').querySelector('i');
            if (value == 0) {
                icon.className = "fa-solid fa-volume-xmark";
            } else {
                icon.className = "fa-solid fa-volume-high";
            }
        }

        function toggleMute() {
            if (audioElement.volume > 0) {
                audioElement.volume = 0;
                document.getElementById('volume-slider').value = 0;
                document.getElementById('btn-volume-icon').querySelector('i').className = "fa-solid fa-volume-xmark";
            } else {
                audioElement.volume = 1;
                document.getElementById('volume-slider').value = 1;
                document.getElementById('btn-volume-icon').querySelector('i').className = "fa-solid fa-volume-high";
            }
        }

        function openFullscreenPlayer() {
            document.getElementById('fullscreen-player').classList.remove('hidden');
            document.getElementById('fullscreen-player').classList.add('flex');
        }

        function closeFullscreenPlayer() {
            document.getElementById('fullscreen-player').classList.add('hidden');
            document.getElementById('fullscreen-player').classList.remove('flex');
        }

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }
    </script>
</body>
</html>
