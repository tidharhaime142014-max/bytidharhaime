<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT - Figma Styled UI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #343541; /* צבע הרקע הרשמי מהעיצוב */
            color: #ECECF1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* אזור ה-Header העליון */
        header {
            background-color: #202123;
            padding: 15px;
            text-align: center;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #4d4d4d;
        }

        /* אזור זרימת ההודעות */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        /* שורת הודעה כללית (רוחב מלא) */
        .message-row {
            width: 100%;
            padding: 24px 20px;
            display: flex;
            justify-content: center;
            border-bottom: 1px solid #2a2b32;
        }

        /* שורת משתמש מקבלת רקע כהה יותר לפי הפיגמה */
        .user-row {
            background-color: #343541;
        }

        /* שורת בוט מקבלת רקע מופרד */
        .bot-row {
            background-color: #444654;
        }

        /* פנים ההודעה - מוגבל במרכז הדף לקריאות */
        .message-content {
            width: 100%;
            max-width: 768px;
            font-size: 16px;
            line-height: 1.6;
            word-wrap: break-word;
            white-space: pre-wrap;
            color: #ECECF1; /* מבטיח שהטקסט תמיד ייראה בלבן-אפרפר */
        }

        .error-message {
            background-color: #442a2a;
            color: #ff8484;
            border-radius: 8px;
            padding: 12px;
            margin: 10px auto;
            max-width: 768px;
            font-size: 14px;
            text-align: center;
        }

        /* אזור הקלט התחתון */
        #input-container {
            background-image: linear-gradient(180deg, rgba(52,53,65,0), #343541 50%);
            padding: 20px 20px 30px 20px;
            display: flex;
            justify-content: center;
            flex-direction: column;
            align-items: center;
        }

        .input-wrapper {
            background-color: #40414F;
            border: 1px solid #303139;
            border-radius: 12px; /* סגנון מרובע מעוגל קלות מהפיגמה */
            width: 100%;
            max-width: 768px;
            display: flex;
            align-items: center;
            padding: 12px 16px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
        }

        /* תיקון קריטי: הגדרת צבע הטקסט בתוך התיבה */
        textarea {
            flex: 1;
            background: none;
            border: none;
            color: #FFFFFF; /* טקסט לבן ברור בזמן הקלדה */
            resize: none;
            height: 24px;
            max-height: 200px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #8E8EA0; /* צבע פלייסהולדר ברור */
        }

        button {
            background-color: transparent;
            color: #8E8EA0;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        button.active {
            background-color: #19C37D; /* הצבע הירוק המקורי של OpenAI */
            color: white;
        }

        /* אנימציית טעינה */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding-top: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #8e8ea0;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>

    <header>ChatGPT - UI v3</header>

    <div id="chat-container">
        <!-- הודעת פתיחה בשורת בוט ייעודית -->
        <div class="message-row bot-row">
            <div class="message-content">שלום! ממשק ה-Figma עודכן בהצלחה והטקסט תוקן. במה אני יכול לעזור לך היום?</div>
        </div>
    </div>

    <div id="input-container">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="שלח הודעה ל-ChatGPT..." rows="1"></textarea>
            <button id="send-btn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');

        let conversationHistory = [
            { role: "system", content: "You are ChatGPT, a helpful AI assistant. Respond in the language used by the user." }
        ];

        textarea.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = this.scrollHeight - 20 + 'px';
            
            if (this.value.trim() !== '') {
                sendBtn.removeAttribute('disabled');
                sendBtn.classList.add('active');
            } else {
                sendBtn.setAttribute('disabled', 'true');
                sendBtn.classList.remove('active');
            }
        });

        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;

            // הוספת הודעת משתמש בעיצוב השורה הנכון
            appendMessageRow(text, 'user-row');
            conversationHistory.push({ role: "user", content: text });

            textarea.value = '';
            textarea.style.height = '24px';
            sendBtn.setAttribute('disabled', 'true');
            sendBtn.classList.remove('active');

            const loadingId = appendLoading();

            try {
                // קריאה מאובטחת לפונקציית השרת המתווכת של Vercel
                const response = await fetch("/api/chat", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (response.ok) {
                    const botResponse = data.choices[0].message.content;
                    appendMessageRow(botResponse, 'bot-row');
                    conversationHistory.push({ role: "assistant", content: botResponse });
                } else {
                    appendError(data.error || "שגיאה בתקשורת עם השרת.");
                }

            } catch (error) {
                removeLoading(loadingId);
                appendError("נכשלה ההתחברות. ודא שקובץ ה-API מוגדר בתיקיית api/chat.js.");
                console.error(error);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessageRow(text, rowTypeClass) {
            const rowDiv = document.createElement('div');
            rowDiv.className = `message-row ${rowTypeClass}`;
            
            const contentDiv = document.createElement('div');
            contentDiv.className = 'message-content';
            contentDiv.innerText = text;
            
            rowDiv.appendChild(contentDiv);
            chatContainer.appendChild(rowDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendError(errorText) {
            const errDiv = document.createElement('div');
            errDiv.className = 'error-message';
            errDiv.innerText = `שגיאה: ${errorText}`;
            chatContainer.appendChild(errDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const rowDiv = document.createElement('div');
            rowDiv.className = 'message-row bot-row';
            rowDiv.id = id;
            rowDiv.innerHTML = `
                <div class="message-content">
                    <div class="typing-indicator">
                        <div class="dot"></div>
                        <div class="dot"></div>
                        <div class="dot"></div>
                    </div>
                </div>
            `;
            chatContainer.appendChild(rowDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
