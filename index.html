<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT אמיתי ומחובר</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #212121;
            color: #ececf1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* אזור ההודעות */
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .message {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 16px;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: #2f2f2f;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .bot-message {
            background-color: transparent;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            width: 100%;
        }

        .error-message {
            background-color: #442a2a;
            color: #ff8484;
            align-self: center;
            border-radius: 8px;
            font-size: 14px;
        }

        /* אזור הקלט למטה */
        #input-container {
            background-color: #212121;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .input-wrapper {
            background-color: #2f2f2f;
            border: 1px solid #424242;
            border-radius: 24px;
            width: 100%;
            max-width: 768px;
            display: flex;
            align-items: center;
            padding: 10px 20px;
        }

        textarea {
            flex: 1;
            background: none;
            border: none;
            color: #ececf1;
            resize: none;
            height: 24px;
            max-height: 200px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        button {
            background-color: #676767;
            color: #212121;
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            margin-right: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        button.active {
            background-color: #ffffff;
        }

        /* אנימציית טעינה ("חשיבה") */
        .typing-indicator {
            display: flex;
            gap: 5px;
            padding-top: 8px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background-color: #8e8ea0;
            border-radius: 50%;
            animation: pulse 1.5s infinite ease-in-out;
        }

        .dot:nth-child(2) { animation-delay: 0.2s; }
        .dot:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
        }
    </style>
</head>
<body>

    <div id="chat-container">
        <!-- הודעת פתיחה -->
        <div class="message bot-message">שלום! ה-API מחובר. במה אני יכול לעזור לך היום?</div>
    </div>

    <div id="input-container">
        <div class="input-wrapper">
            <textarea id="user-input" placeholder="שלח הודעה ל-ChatGPT..." rows="1"></textarea>
            <button id="send-btn" disabled>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://w3.org">
                    <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // ⚠️ הכנס את מפתח ה-API שלך פה למטה במקום הטקסט שבמרכאות:
        const OPENAI_API_KEY = "YOUR_OPENAI_API_KEY"; 

        const textarea = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const chatContainer = document.getElementById('chat-container');

        // מערך לשמירת היסטוריית השיחה כדי שהמודל יזכור הקשר
        let conversationHistory = [
            { role: "system", content: "You are ChatGPT, a helpful AI assistant. Respond in the language used by the user." }
        ];

        // התאמה דינמית של גובה תיבת הטקסט
        textarea.addEventListener('input', function() {
            this.style.height = '24px';
            this.style.height = this.scrollHeight - 20 + 'px';
            
            if (this.value.trim() !== '') {
                sendBtn.removeAttribute('disabled');
                sendBtn.classList.add('active');
            } else {
                sendBtn.setAttribute('disabled', 'true');
                sendBtn.classList.remove('active');
            }
        });

        // שליחת הודעה
        async function sendMessage() {
            const text = textarea.value.trim();
            if (!text) return;

            // בדיקה אם המשתמש שכח להחליף את המפתח בקוד
            if (OPENAI_API_KEY === "YOUR_OPENAI_API_KEY") {
                appendMessage("שגיאה: לא הגדרת מפתח API בשורה 175 בקוד.", 'error-message');
                return;
            }

            // 1. הוספת הודעת המשתמש למסך ולזיכרון
            appendMessage(text, 'user-message');
            conversationHistory.push({ role: "user", content: text });

            textarea.value = '';
            textarea.style.height = '24px';
            sendBtn.setAttribute('disabled', 'true');
            sendBtn.classList.remove('active');

            // 2. הוספת אנימציית "חשיבה"
            const loadingId = appendLoading();

            // 3. פנייה אמיתית לשרת של OpenAI
            try {
                const response = await fetch("https://openai.com", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${OPENAI_API_KEY}`
                    },
                    body: JSON.stringify({
                        model: "gpt-4o-mini",
                        messages: conversationHistory
                    })
                });

                const data = await response.json();
                removeLoading(loadingId);

                if (response.ok) {
                    const botResponse = data.choices[0].message.content;
                    // הצגת התשובה ושמירתה בהיסטוריית השיחה
                    appendMessage(botResponse, 'bot-message');
                    conversationHistory.push({ role: "assistant", content: botResponse });
                } else {
                    // טיפול בשגיאות שמגיעות מ-OpenAI (למשל מפתח לא בתוקף או חוסר בקרדיט)
                    appendMessage(`שגיאת מערכת: ${data.error.message}`, 'error-message');
                }

            } catch (error) {
                removeLoading(loadingId);
                appendMessage("נכשלה ההתחברות לשרת. בדוק את החיבור לאינטרנט שלך.", 'error-message');
                console.error(error);
            }
        }

        // מאזיני אירועים לשליחה (לחיצה או אנטר)
        sendBtn.addEventListener('click', sendMessage);
        textarea.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendLoading() {
            const id = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot-message';
            loadingDiv.id = id;
            loadingDiv.innerHTML = `
                <div class="typing-indicator">
                    <div class="dot"></div>
                    <div class="dot"></div>
                    <div class="dot"></div>
                </div>
            `;
            chatContainer.appendChild(loadingDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return id;
        }

        function removeLoading(id) {
            const el = document.getElementById(id);
            if (el) el.remove();
        }
    </script>
</body>
</html>
